name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Vite production build + inline into a single self-contained artifact.html
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cashgrid-single-file
          path: artifact.html
          if-no-files-found: error
